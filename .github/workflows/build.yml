name: Build

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to build'
        required: true
        type: string
      head_sha:
        description: 'Current PR head SHA (7 to 40 hexadecimal characters)'
        required: true
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual PR {0} {1}', inputs.pr_number, inputs.head_sha) || github.event_name == 'pull_request' && format('PR {0}', github.event.pull_request.number) || github.sha }}

permissions:
  contents: read
  pull-requests: read

jobs:
  target:
    name: Record workflow target
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      repository: ${{ steps.resolve.outputs.repository }}
      simulator_repository: ${{ steps.resolve.outputs.simulator_repository }}
      simulator_commit: ${{ steps.resolve.outputs.simulator_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record PR head or default-branch commit
        id: resolve
        env:
          TARGET_EVENT: ${{ github.event_name }}
          TARGET_PR: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number || 0 }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TARGET_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          TARGET_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_SIMULATOR_REPOSITORY: Schnuartz/specter-diy-web-simulator
          TARGET_SIMULATOR_COMMIT: df65718d41003f99aa95cd53ef882dc675b7bfa9
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/simulator/resolve_build_target.py
      - uses: actions/upload-artifact@v4
        with:
          name: build-target
          if-no-files-found: error
          path: target.json

  native-tests:
    name: Specter native tests
    runs-on: ubuntu-latest
    needs: target
    env:
      EXPECTED_SHA: ${{ needs.target.outputs.sha }}
      SPECTER_SOURCE_REPOSITORY: ${{ needs.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SPECTER_SOURCE_REPOSITORY }}
          ref: ${{ env.EXPECTED_SHA }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r test/integration/requirements.txt
      - run: python3 run_native_tests.py
        working-directory: test
      - name: Install Unix simulator test libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libgmp-dev libreadline-dev libsdl2-dev pkg-config
      - name: Run firmware integration tests on the Unix simulator
        run: make test LDFLAGS_EXTRA=-Wl,--allow-multiple-definition

  build:
    name: Build firmware from PR head
    runs-on: ubuntu-latest
    needs: target
    env:
      EXPECTED_SHA: ${{ needs.target.outputs.sha }}
      SPECTER_SOURCE_REPOSITORY: ${{ needs.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SPECTER_SOURCE_REPOSITORY }}
          ref: ${{ env.EXPECTED_SHA }}
          submodules: recursive
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ github.sha }}
          path: trusted-tools
      - uses: DeterminateSystems/nix-installer-action@v14
      - name: Build Unix simulator and STM32 firmware
        run: |
          nix develop -c make unix
          nix develop -c make disco
      - name: Record firmware provenance
        run: |
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            python3 trusted-tools/.github/simulator/source_info.py firmware
          else
            python3 .github/simulator/source_info.py firmware
          fi
      - name: Upload firmware binaries
        id: firmware-upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          if-no-files-found: error
          path: |
            bin/specter-diy.bin
            bin/specter-diy.hex
            source.json
      - name: Add firmware download to workflow summary
        env:
          ARTIFACT_URL: ${{ steps.firmware-upload.outputs.artifact-url }}
        run: |
          echo "## Specter firmware" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the tested firmware artifact]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "For the normal STM32 flashing workflow use bin/specter-diy.bin at address 0x08000000, or use bin/specter-diy.hex with a compatible flasher." >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Build and smoke-test browser simulator
    needs: target
    uses: Schnuartz/specter-diy-web-simulator/.github/workflows/browser-simulator.yml@df65718d41003f99aa95cd53ef882dc675b7bfa9
    with:
      source_repository: ${{ needs.target.outputs.repository }}
      source_commit: ${{ needs.target.outputs.sha }}
      simulator_repository: ${{ needs.target.outputs.simulator_repository }}
      simulator_commit: ${{ needs.target.outputs.simulator_commit }}
      pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number || 0 }}
