name: Browser simulator

# This workflow is deliberately reusable. It can stay beside the simulator
# tooling today and later be moved to a dedicated simulator repository. The
# caller remains responsible for selecting both immutable input commits.
on:
  workflow_call:
    inputs:
      source_repository:
        description: Repository containing the Specter source to simulate
        required: true
        type: string
      source_commit:
        description: Full commit SHA of the Specter source
        required: true
        type: string
      simulator_repository:
        description: Repository containing the simulator tooling
        required: true
        type: string
      simulator_commit:
        description: Full commit SHA of the simulator tooling
        required: true
        type: string
      pr_number:
        description: PR number for the workflow summary, or 0 for a branch build
        required: true
        type: number

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test browser simulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ inputs.source_commit }}
      SPECTER_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      SIMULATOR_REPOSITORY: ${{ inputs.simulator_repository }}
      SIMULATOR_COMMIT: ${{ inputs.simulator_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_commit }}
          submodules: recursive
      - name: Check out the pinned simulator tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.simulator_repository }}
          ref: ${{ inputs.simulator_commit }}
          path: simulator-tools
      - name: Overlay simulator tooling onto the source checkout
        run: |
          test -d simulator-tools/web
          rsync -a --delete simulator-tools/web/ web/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git .browser-work/emsdk
          .browser-work/emsdk/emsdk install 3.1.74
          .browser-work/emsdk/emsdk activate 3.1.74
      - name: Build actual Specter code for WebAssembly
        run: bash web/browser/build-browser.sh
      - name: Verify source, simulator, and artifact hashes
        run: python3 web/browser/verify_build.py
      - name: Test preview provenance and publication rules
        run: |
          python3 web/tests/test-publisher.py
          python3 web/tests/test-trigger-pr.py
          python3 web/tests/test-resolve-build-target.py
      - name: Browser smoke tests
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          python3 -m http.server 8765 --directory web > /tmp/specter-browser.log 2>&1 &
          CI=true npm run test:browser --prefix web
      - name: Record browser provenance
        run: python3 web/tools/source_info.py browser
      - name: Upload browser simulator
        id: browser-upload
        uses: actions/upload-artifact@v4
        with:
          name: browser-simulator
          if-no-files-found: error
          path: |
            web/index.html
            web/assets/**
            web/browser/site.js
            web/browser/runtime-worker.js
            web/browser/runtime/**
            web/browser/current.json
            web/builds/**
            source.json
      - name: Add simulator links to workflow summary
        env:
          ARTIFACT_URL: ${{ steps.browser-upload.outputs.artifact-url }}
          PREVIEW_NUMBER: ${{ inputs.pr_number }}
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPOSITORY="${GITHUB_REPOSITORY#*/}"
          echo "## Specter browser simulator" >> "$GITHUB_STEP_SUMMARY"
          if test "$PREVIEW_NUMBER" != "0"; then
            echo "[Open this PR in the browser simulator](https://${OWNER}.github.io/${REPOSITORY}/pr/${PREVIEW_NUMBER}/)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The preview becomes available after the trusted Publish workflow has accepted this build." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[Download the tested browser build]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the live reference simulator](https://try.clavastack.com/?variant=diy) (reference deployment, not this commit)" >> "$GITHUB_STEP_SUMMARY"
