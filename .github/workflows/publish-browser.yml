name: Publish browser simulator

# Publishing remains triggered by the trusted workflow_run event in the
# Specter-DIY repository. The implementation lives in the simulator repo, but
# the calling repository retains the token, Pages site, PR context, and
# gh-pages branch.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: Schnuartz/specter-diy-web-simulator/.github/workflows/publish-browser.yml@0d6988558b410c642d83ab1946f128fe978a4577
    with:
      simulator_repository: Schnuartz/specter-diy-web-simulator
      simulator_commit: 0d6988558b410c642d83ab1946f128fe978a4577
