name: Publish browser simulator

# Publishing remains triggered by the trusted workflow_run event in the
# Specter-DIY repository. The implementation lives in the simulator repo, but
# the calling repository retains the token, Pages site, PR context, and
# gh-pages branch.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: cryptoadvance/specter-diy-web-simulator/.github/workflows/publish-browser.yml@c3373fef311b8684d0ea226ba17d4a2880abee12
    with:
      simulator_repository: cryptoadvance/specter-diy-web-simulator
      simulator_commit: c3373fef311b8684d0ea226ba17d4a2880abee12
