name: Publish browser simulator

# Publishing remains triggered by the trusted workflow_run event in the
# Specter-DIY repository. The implementation lives in the simulator repo, but
# the calling repository retains the token, Pages site, PR context, and
# gh-pages branch.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  publish:
    uses: Schnuartz/specter-diy-web-simulator/.github/workflows/publish-browser.yml@795801ddce7f0dbd37f0dfcccfdec6d4d058b38d
    with:
      simulator_repository: Schnuartz/specter-diy-web-simulator
      simulator_commit: 795801ddce7f0dbd37f0dfcccfdec6d4d058b38d
